<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rechtliche Informationen</title>
    <style>
      @font-face {
        font-family: "NeutralFaceBold";
        src: url("./fonts/NeutralFaceBold.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: "PublicSans";
        src: url("./fonts/PublicSans-VariableFont_wght.ttf") format("truetype");
        font-weight: normal;
        font-weight: 400;
        font-style: normal;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-color: #4a4b4d;
        color: #f2f1f0;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(680px, calc(100% - 32px));
        padding: 48px 0;
        text-align: center;
        font-family: "PublicSans", Arial;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(30px, 5vw, 46px);
        line-height: 1.2;
      }
      p {
        margin: 0 0 30px;
        font-size: 17px;
        line-height: 1.6;
      }
      nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      a {
        display: flex;
        min-height: 92px;
        align-items: center;
        justify-content: center;
        padding: 20px;
        border: 1px solid #d8d8d8;
        border-radius: 12px;
        font-size: 19px;
        font-weight: 500;
        text-decoration: none;
        color: #2a3f1ae8;
        background-color: #2a3f1ae8;
        color: #fff;
        transition:
          transform 0.2s ease,
          opacity 0.2s ease,
          background-color 0.2s ease;
      }
      a:hover,
      a:focus-visible {
        border-color: #2a3f1ae8;
        border: 5px;
        opacity: 0.9;
      }
      h1,
      h2 {
        font-family:
          "NeutralFaceBold",
          Segoe UI;
      }
      @media (max-width: 560px) {
        nav {
          grid-template-columns: 1fr;
        }
        main {
          padding: 32px 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rechtliche Informationen</h1>
      <p>Bitte wählen Sie die gewünschte Seite aus.</p>
      <nav aria-label="Rechtliche Seiten">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutzerklaerung.html">Datenschutzerklärung</a>
      </nav>
    </main>
  </body>
</html>
