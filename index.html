<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rechtliche Informationen</title>

    <style>
      @font-face { 
        font-family: "NeutralFaceBold"; 
        src: url("./fonts/NeutralFaceBold.otf") format("opentype"); 
        font-weight: 500; 
        font-style: normal; 
        unicode-range: U+0041-005A, U+0061-007A, U+0030-0039; 
      }
      
      @font-face { 
        font-family: "PublicSansUmlaut"; 
        src: url("./fonts/PublicSans-VariableFont_wght.ttf") format("truetype"); 
        font-weight: 700; 
        font-style: normal; 
        unicode-range: U+00C4, U+00D6, U+00DC, U+00E4, U+00F6, U+00FC, U+00DF, U+1E9E;
      }

      @font-face {
        font-family: "PublicSans";
        src: url("./fonts/PublicSans-VariableFont_wght.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-color: #272829;
        color: #f2f1f0;
        font-family: "PublicSans", Helvetica, sans-serif;
      }

      main {
        width: min(900px, calc(100% - 32px));
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 20px;
        font-family: "NeutralFaceBold", "PublicSansUmlaut", "PublicSans", sans-serif;
        font-size: clamp(25px, 5vw, 54px);
        line-height: 1;
        letter-spacing: -0.035em;
      }

      p {
        margin: 0 0 32px;
        color: rgba(242, 241, 240, 0.62);
        font-size: 15px;
        line-height: 1.5;
      }

      nav {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        border-top: 1px solid rgba(242, 241, 240, 0.5);
      }

      nav a {
        position: relative;
        isolation: isolate;
        overflow: hidden;

        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;

        min-height: 118px;
        padding: 0 10px;

        border: 0;
        border-bottom: 1px solid rgba(242, 241, 240, 0.5);
        border-radius: 0;

        background-color: transparent;
        color: #f2f1f0;
        font-size: clamp(22px, 4vw, 34px);
        line-height: 1.2;
        text-align: left;
        text-decoration: none;
        line-height: 1.25;
        font-weight: 500;
        font-family:
            "NeutralFaceBold",
            "PublicSansUmlaut",
            "PublicSans",
            sans-serif;
        text-transform: uppercase;

        transition:
          color 0.1s ease,
          padding 0.28s ease;
      }

      nav a span {
        position: relative;
        z-index: 2;
      }

      nav a .fill {
        position: absolute;
        inset: 0;
        background-color: #f2f1f0;
        transform: translateY(100%);
        transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 1;
      }

      nav a:hover {
        color: #272829;
        padding-left: 18px;
      }

      nav a:hover .fill {
        transform: translateY(0);
      }

      nav a:focus-visible {
        outline: 2px solid #f2f1f0;
        outline-offset: 4px;
      }

      h1 {
        margin: 0 0 32px;
        font-size: clamp(22px, 5vw, 48px);
      }
      h2 {
        margin: 40px 0 12px;
        font-size: clamp(18px, 4vw, 32px);
      }

      h3 {
        margin: 32px 0 16px;
        font-size: clamp(16px, 3vw, 28px);
      }
      
      h4 {
        margin: 24px 0 16px;
        font-size: clamp(16px, 3vw, 28px);
      }

      @media (max-width: 600px) {
        nav {
          margin: 0 -12px;
        }
        nav a {
          padding: 0 16px;
        }
        
        a:hover {
          transition: color 0s ease, padding 0.28s ease;
        }
        body {
          place-items: start center;
        }

        main {
          width: calc(100% - 24px);
          padding: 56px 0 40px;
        }

        h1 {
          font-size: 27px;
          letter-spacing: -0.04em;
        }

        p {
          margin-bottom: 38px;
        }

        nav a {
          min-height: 100px;
          font-size: 22px;
        }

        nav a:hover {padding-left: 10px;
        }
      }

      @media (max-width: 380px) {
        h1 {
          font-size: 24px;
        }

        nav a {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Rechtliche Informationen</h1>
      <p>Bitte wählen Sie die gewünschte Seite aus.</p>

      <nav aria-label="Rechtliche Seiten">
        <a href="./impressum.html">
          <span class="fill" aria-hidden="true"></span>
          <span>Impressum</span>
        </a>

        <a href="./datenschutzerklaerung.html">
          <span class="fill" aria-hidden="true"></span>
          <span>Datenschutzerklärung</span>
        </a>
      </nav>
    </main>
  </body>
</html>
