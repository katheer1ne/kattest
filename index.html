<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rechtliche Informationen</title>

    <style>
      @font-face {
        font-family: "NeutralFaceBold";
        src: url("./fonts/NeutralFaceBold.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "PublicSans";
        src: url("./fonts/PublicSans-VariableFont_wght.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-color: #4a4b4d;
        color: #f2f1f0;
        font-family: "PublicSans", Arial, Helvetica, sans-serif;
      }

      main {
        width: min(780px, calc(100% - 32px));
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 14px;
        font-family: "NeutralFaceBold", "Segoe UI", Arial, sans-serif;
        font-size: clamp(25px, 5vw, 54px);
        line-height: 1;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }

      p {
        margin: 0 0 54px;
        color: rgba(242, 241, 240, 0.62);
        font-size: 15px;
        line-height: 1.5;
      }

      nav {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        border-top: 1px solid rgba(242, 241, 240, 0.5);
      }

      nav a {
        position: relative;
        isolation: isolate;
        overflow: hidden;

        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;

        min-height: 118px;
        padding: 0 10px;

        border: 0;
        border-bottom: 1px solid rgba(242, 241, 240, 0.5);
        border-radius: 0;

        background-color: transparent;
        color: #f2f1f0;

        font-family: "NeutralFaceBold", "Segoe UI", Arial, sans-serif;
        font-size: clamp(22px, 4vw, 34px);
        line-height: 1.2;
        text-align: left;
        text-decoration: none;

        transition:
          color 0.28s ease,
          padding 0.28s ease;
      }

      nav a::after {
        content: "↗";
        font-family: "PublicSans", Arial, sans-serif;
        font-size: 28px;
        font-weight: 300;
        position: relative;
        z-index: 2;

        transition:
          transform 0.28s ease,
          opacity 0.28s ease;
      }

      nav a span {
        position: relative;
        z-index: 2;
      }

      nav a .fill {
        position: absolute;
        inset: 0;
        background-color: #f2f1f0;
        transform: translateY(100%);
        transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 1;
      }

      nav a:hover {
        color: #4a4b4d;
        padding-left: 18px;
      }

      nav a:hover .fill {
        transform: translateY(0);
      }

      nav a:focus-visible {
        outline: 2px solid #f2f1f0;
        outline-offset: 4px;
      }

      @media (max-width: 600px) {
        body {
          place-items: start center;
        }

        main {
          width: calc(100% - 24px);
          padding: 56px 0 40px;
        }

        h1 {
          font-size: 27px;
          letter-spacing: -0.04em;
        }

        p {
          margin-bottom: 38px;
        }

        nav a {
          min-height: 100px;
          font-size: 22px;
          padding: 0 4px;
        }

        nav a:hover {padding-left: 10px;
        }

        nav a::after {
          font-size: 23px;
        }
      }

      @media (max-width: 380px) {
        h1 {
          font-size: 24px;
        }

        nav a {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Rechtliche Informationen</h1>
      <p>Bitte wählen Sie die gewünschte Seite aus.</p>

      <nav aria-label="Rechtliche Seiten">
        <a href="./impressum.html">
          <span class="fill" aria-hidden="true"></span>
          <span>Impressum</span>
        </a>

        <a href="./datenschutzerklaerung.html">
          <span class="fill" aria-hidden="true"></span>
          <span>Datenschutzerklärung</span>
        </a>
      </nav>
    </main>
  </body>
</html>
